   <g id="text_1">
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(24.49717 48.114246)">Known surface descriptors</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(31.668186 63.284559)">Internal: measured x or</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(41.922248 77.534559)">learned unknown u</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(30.866623 90.864246)">Mask / position / ordinal</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(222.590898 48.114246)">64 regional tokens</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(210.728515 62.364246)">102 inputs → width 128</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(221.545898 76.614246)">+ one global token</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(216.77289 90.864246)">6 inputs → width 128</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(409.857556 49.034559)">Transformer</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(397.550602 62.364246)">2 layers, 4 heads</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(396.524157 77.534559)">Feed-forward 256</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(388.393493 91.784559)">65 contextual tokens</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(394.804509 168.941646)">64 regional scores</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(390.151735 184.111959)">+ feasible-cell mask</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(382.787009 197.295435)">Argmax → next request</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(37.800761 165.065286)">Independent strength predictor</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(32.292987 179.315286)">Mask internal x before affine map</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(46.267636 194.485599)">Mean-all + mean-measured</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(39.96869 207.815286)">History excluded from readout</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(235.817688 266.400846)">Global state: area / remaining area</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(233.608938 281.197838)">Current CAI / measured-cell fraction</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(253.304367 295.821159)">Area fraction ≠ cell fraction</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(25.29792 260.973387)">Unknown ≠ observed zero.</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(25.29792 272.375985)">Two zero VLM channels per block.</text>
    <text style="font-size: 9.5px; font-family: 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(25.29792 283.778582)">See S2 for the exact input layout.</text>
   </g>
