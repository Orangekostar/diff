  target_data_forbidden_from_fit: true
  source_prior_statistic: equal_domain_mean_of_source_specimen_full_cscan_border_medians
  source_prior_quantization: round_half_to_even_clip_uint8
  cai_assessor_representation: [frozen_resnet18_reconstruction_512d, effective_budget, observed_cell_fraction, mean_observed_level]
  cai_assessor_pca_dimension: 32
  cai_assessor_ridge_alpha: 10.0
  cai_assessor_fit_state_sources: [WARM_START, UNIFORM_CONTINUE, SURFACE_FOCUS_CONTINUE, RANDOM_CONTINUE, ALTERNATE_BROADEN_REFINE]
  cai_assessor_oracle_states_forbidden: true

teacher_bank:
  tasks: [FIELD, CAI]
  warm_start_states: 1
  continuation_policies: [UNIFORM_CONTINUE, SURFACE_FOCUS_CONTINUE, RANDOM_CONTINUE, ALTERNATE_BROADEN_REFINE]
  continuation_snapshot_fractions: [0.3333333333333333, 0.6666666666666666, 1.0]
  continuation_snapshot_axis: action_count_to_0.25
  oracle_checkpoints: [0.0625, 0.125, 0.1875, 0.25]
  maximum_pre_dagger_states_per_specimen_task: 17
  duplicate_checkpoint_policy: preserve_one_and_record_actual_count
  random_seed: 2026090101
  random_identity: sha256_seed_outer_fold_specimen_surface_task
  equal_physical_specimen_weight: true
  equal_task_weight: true
  storage_format: parquet_zstd
  work_path: results/inspection_agent/g1_work/teacher_banks

features:
  reconstruction_embedding_dimension: 512
  global_scalar_dimension: 17
  cell_count: 64
  cell_feature_dimension: 18
  candidate_feature_dimension: 12
  cai_context_candidates: [TASK_SPECIFIC_MASKED, SHARED_OBSERVABLE_STATE_CONTEXT]
  cai_context_selection: inner_source_validation_only
  privileged_columns_rejected: [true_cai, full_scan, dataset_id, specimen_id, oracle_value, oracle_utility, future_measurement, true_task_loss]
  scanner_geometry_features: [height_over_1024, width_over_1024, log_height_width_ratio]

teacher_distribution:
  utility: privileged_objective_value
  regret: best_utility_minus_candidate_utility
  scale: max_within_state_iqr_and_epsilon
  epsilon: 1.0e-12
  tie_tolerance: 1.0e-12
  temperatures: [0.25, 0.5, 1.0, 2.0]
  temperature_selection: inner_source_validation_only
  all_tied_distribution: uniform_over_legal_actions

models:
  candidates: [SharedActionMLP, StructuredInspectionPolicy]
  primary_parameter_cap: 1000000
  structured:
    reconstruction_projection: 128
    task_embedding: 16
    scalar_projection: 32
    model_dimension: 128
    transformer_layers: 2
    attention_heads: 4
    feedforward_dimension: 256
    dropout: 0.1
    cell_hidden_dimensions: [128, 128]
    action_hidden_dimensions: [128, 64]
    stop_hidden_dimension: 64
  shared_action_mlp:
    hidden_dimensions: [256, 128, 64]
    dropout: 0.1
  illegal_action_logit: negative_infinity

training:
  routes: [HARD_BC, SOFT_UTILITY_DISTILL]
  dagger_iterations: [0, 1, 2]
  dagger_max_new_states_per_specimen_task_iteration: 16
  dagger_state_selection: deterministic_trajectory_quantiles
  dagger_worlds: outer_source_only
  epochs: 80
  early_stopping_patience: 12
  batch_specimens: 8
  gradient_clip_norm: 1.0
  learning_rates: [0.0001, 0.0003]
  weight_decays: [0.0001, 0.001]
  optimizer: AdamW
  initialization_seed: 2026090102
  selection_priority: [equal_domain_mean_engineering_auebc, oracle_gap_closure, improved_source_domains, simpler_model]
  deterministic_algorithms: true
  tf32: false
  cudnn_benchmark: false

privileged_awr:
  status_before_source_selection: CONDITIONAL
  authorization_rule: positive_source_action_observability_and_gap_closure_below_0.20_on_any_authorized_task
  target_rescue_forbidden: true
  copied_external_code_forbidden: true
  actor_inputs: policy_visible_only
  critic_hidden_dimensions: [256, 128]
  expectile_candidates: [0.7, 0.8]
  beta_candidates: [1.0, 3.0]
  maximum_advantage_weight: 100.0
  reward: task_loss_reduction

stopping:
  trained_separately: true
  source_teacher_tolerance_relative: 0.05
  threshold_candidates: [0.50, 0.70, 0.80, 0.90, 0.95, 0.975, 0.99]
  threshold_selection: source_only_maximum_saving_subject_to_premature_rate_at_most_0.05_and_loss_ratio_at_most_1.05
  fallback: fixed_endpoint_0.25
  minimum_saving: 0.10
  maximum_task_loss_ratio: 1.05
  maximum_premature_rate: 0.05

controls:
  task_variants: [TASK_CONDITIONED, NO_TASK, WRONG_TASK]
  surface_variants: [CORRECT_SURFACE, NO_SURFACE, SHUFFLED_SURFACE]
  shuffled_surface_seed: 2026090103
  shuffled_surface_rule: deterministic_same_domain_nonself_donor
  frozen_surface_strata: [AGREE, PARTIAL, MISLEADING]

baselines:
  gate_eligible_fixed: [RANDOM, ZERO_UNIFORM, CENTER_FIRST, SURFACE_FOCUS, SURVEY_THEN_REFINE_FIXED]
  learned: [HARD_BC, SharedActionMLP, NO_TASK, NO_SURFACE, SHUFFLED_SURFACE, PROPOSED]
  privileged: [ORACLE_FIELD, ORACLE_CAI]
  historical_upper_bound: FIXED_UNIFORM_THEN_MAVIS
  historical_gate_eligible: false

statistics:
  inferential_unit: physical_specimen_then_equal_weight_domain
  bootstrap: synchronized_specimen_within_domain
  bootstrap_replicates: 100000
  bootstrap_seed: 2026090104
  confidence_level: 0.95

gates:
  policy_ci_lower_strictly_positive: true
  policy_improved_domains_minimum: 4
  policy_oracle_gap_closure_minimum: 0.20
  task_conditioning_ci_lower_strictly_positive: true
  task_conditioning_improved_domains_minimum: 4
  replay_required: true
  no_target_leakage_required: true
  final_statuses: [G1_TASK_CONDITIONED_POLICY_GO, G1_ACTIVE_POLICY_GO, G1_CAI_ONLY_POLICY_GO, G1_FIELD_ONLY_POLICY_GO, G1_POLICY_OBSERVABILITY_NO_GO, G1_DEPLOYMENT_BRIDGE_NO_GO]

execution:
