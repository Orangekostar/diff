    <dc:title>figure1_information_hierarchy</dc:title>
    <dc:date>2026-08-26</dc:date>
    <dc:description>Figure 1. Task-relevant information hierarchy. Useful information improves the engineering task, observable information can be inferred from legally available inspection state, and actionable information improves a bounded sensing decision. Retrospective teacher/oracle evidence is separated from the deployable state and policy; passing one question does not imply the next.</dc:description>
