    loss: smooth_l1
    optimizer: adam
    learning_rate: 0.001
    weight_decay: 0.0001
    epochs: 50
    specimen_batch_size: 128
    gradient_clip_norm: 5.0
    dtype: float32
    device: cuda:0
    parameter_cap_exclusive: 100000
  standardization: source_training_only_mean_std_zero_variance_to_one
  specimen_weighting: equal_domain_then_equal_specimen
  outer_split: leave_one_domain_out
  inner_split: leave_one_source_domain_out
  selection_order:
    - equal_domain_mean_ndcg_10_desc
    - equal_domain_mean_next_action_regret_asc
    - parameter_count_asc
    - config_id_lexicographic
  target_scores_frozen_before_target_labels: true

fusion:
